name: Critical data paths
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:guild
      - run: npx playwright install chromium
      - run: npm run test:browser
      - if: ${{ !cancelled() }}
        run: npm run test:guild-browser
      - if: ${{ !cancelled() }}
        run: npm run test:ocr
      - if: ${{ !cancelled() }}
        run: npm run test:ocr-browser

      - name: Package tested static beta
        if: success()
        run: node scripts/build-beta.cjs
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: tower-guild-beta
          path: dist/
          retention-days: 14
