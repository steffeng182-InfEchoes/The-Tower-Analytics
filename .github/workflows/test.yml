name: Critical data paths
on: [push, pull_request]
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run test:guild
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: npm run test:guild-browser
      - run: npm run test:ocr
      - run: npm run test:ocr-browser

