name: Hosted Tower beta acceptance
on:
  push:
    branches: [feature/guild-supabase-foundation]
permissions:
  contents: read
  id-token: write
concurrency:
  group: hosted-tower-acceptance
  cancel-in-progress: true
jobs:
  hosted-beta:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install chromium
      - name: Real hosted Auth, RLS, API, browser, offline and account-switch acceptance
        run: node scripts/hosted-acceptance.cjs
      - name: Public database health under its restricted RLS policy
        run: node scripts/cloud-health.cjs
